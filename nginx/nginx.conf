# Зоны ограничения частоты запросов
# Выделяет по 10MB памяти под хранение состояний IP-адресов (~160 000 IP)
limit_req_zone $binary_remote_addr zone=shorten_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=read_limit:10m rate=50r/s;

# Код ошибки при превышении лимита (вместо дефолтного 503)
limit_req_status 429;

upstream backend {
    server app:8000;
    keepalive 32; # Держать открытыми до 32-ух TCP-соединений
}

server {
    listen 80;

    client_max_body_size 2M;

    proxy_http_version 1.1;
    proxy_set_header Connection ""; # keepalive

    # Прокси-заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Создание ссылок
    location = /shorten {
        limit_req zone=shorten_limit burst=10 nodelay;
        proxy_pass http://backend;
    }

    # 2. Все остальные пути (редиректы, статистика, docs)
    location / {
        limit_req zone=read_limit burst=20 nodelay;
        proxy_pass http://backend;
    }
}