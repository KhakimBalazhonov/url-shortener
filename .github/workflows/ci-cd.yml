name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Клонирует репозиторий на раннер

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Ruff Lint
        run: uv run ruff check

      - name: Run Ruff Format Check
        run: uv run ruff format --check

      - name: Run Pyright Type Checker
        run: uv run pyright

  test:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    env:
      # В CI нет файла .env, без этих настроек приложение выдаст ошибку
      # В тестах база и редис берутся из testcontainers, а не по этим адресам
      SQIDS_ALPHABET: ZYXWVUTSRQPONMLKJIHGFEDCBAzyxwvutsrqponmlkjihgfedcba9876543210
      BASE_URL: http://localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB_NAME: shortener
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src/app --cov-report=term-missing --cov-fail-under=70

  # CD: сборка и публикация Docker-образа в GHCR
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Push Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"  # ,, переводит имя в нижний регистр
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push --all-tags "$IMAGE"