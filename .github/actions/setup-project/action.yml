name: Setup project
description: Install Python and project dependencies using uv

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --frozen